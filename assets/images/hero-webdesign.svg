<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="t d">
  <title id="t">Webdesign-Illustration</title>
  <desc id="d">Abstrakte Darstellung einer modernen Website auf Laptop und Smartphone in Schwarz und Gold</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17181d"/><stop offset="1" stop-color="#0b0c0f"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6c88f"/><stop offset="1" stop-color="#b08a4e"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d1f26"/><stop offset="1" stop-color="#121318"/></linearGradient>
    <radialGradient id="glow" cx=".72" cy=".3" r=".6"><stop offset="0" stop-color="#c9a76e" stop-opacity=".38"/><stop offset="1" stop-color="#c9a76e" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".05"/></pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="30" stdDeviation="28" flood-color="#000" flood-opacity=".6"/></filter>
    <clipPath id="lap"><rect x="150" y="150" width="820" height="520" rx="22"/></clipPath>
    <clipPath id="ph"><rect x="812" y="330" width="210" height="430" rx="30"/></clipPath>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>
  <circle cx="990" cy="190" r="260" fill="none" stroke="#c9a76e" stroke-opacity=".18"/>
  <circle cx="990" cy="190" r="180" fill="none" stroke="#c9a76e" stroke-opacity=".12"/>

  <!-- Laptop -->
  <g filter="url(#sh)">
    <rect x="130" y="130" width="860" height="560" rx="30" fill="#2a2c33"/>
    <rect x="150" y="150" width="820" height="520" rx="22" fill="url(#screen)"/>
    <path d="M60 700h1000l-40 34a40 40 0 0 1-28 12H128a40 40 0 0 1-28-12z" fill="#3a3c44"/>
    <rect x="470" y="700" width="220" height="12" rx="6" fill="#23252b"/>
  </g>
  <g clip-path="url(#lap)">
    <rect x="150" y="150" width="820" height="46" fill="#15161b"/>
    <circle cx="180" cy="173" r="6" fill="#4a4c54"/><circle cx="202" cy="173" r="6" fill="#4a4c54"/><circle cx="224" cy="173" r="6" fill="#4a4c54"/>
    <rect x="300" y="161" width="360" height="24" rx="12" fill="#0d0e11"/>
    <!-- Navigation -->
    <rect x="190" y="226" width="36" height="36" rx="10" fill="url(#gold)"/>
    <rect x="560" y="238" width="60" height="10" rx="5" fill="#6d6f77"/><rect x="640" y="238" width="60" height="10" rx="5" fill="#6d6f77"/><rect x="720" y="238" width="60" height="10" rx="5" fill="#6d6f77"/>
    <rect x="808" y="228" width="118" height="32" rx="8" fill="none" stroke="#c9a76e" stroke-opacity=".7"/>
    <!-- Hero-Bereich -->
    <rect x="190" y="320" width="150" height="10" rx="5" fill="#c9a76e"/>
    <rect x="190" y="350" width="400" height="34" rx="8" fill="#f1efe9"/>
    <rect x="190" y="396" width="330" height="34" rx="8" fill="#f1efe9"/>
    <rect x="190" y="442" width="260" height="34" rx="8" fill="url(#gold)"/>
    <rect x="190" y="500" width="380" height="10" rx="5" fill="#6d6f77"/><rect x="190" y="522" width="320" height="10" rx="5" fill="#6d6f77"/>
    <rect x="190" y="562" width="140" height="42" rx="9" fill="url(#gold)"/>
    <rect x="344" y="562" width="120" height="42" rx="9" fill="none" stroke="#8a8c94"/>
    <!-- Bildfläche -->
    <rect x="640" y="310" width="290" height="300" rx="16" fill="#23252d"/>
    <path d="M640 520c60-60 110-70 160-30s90 20 130-30v150a16 16 0 0 1-16 16H656a16 16 0 0 1-16-16z" fill="#c9a76e" fill-opacity=".22"/>
    <circle cx="850" cy="372" r="26" fill="#e6c88f" fill-opacity=".85"/>
    <path d="M640 590l90-90 70 56 60-46 70 60v40a16 16 0 0 1-16 16H656a16 16 0 0 1-16-16z" fill="#0f1014" fill-opacity=".55"/>
  </g>

  <!-- Smartphone -->
  <g filter="url(#sh)">
    <rect x="800" y="318" width="234" height="454" rx="40" fill="#2a2c33"/>
    <rect x="812" y="330" width="210" height="430" rx="30" fill="#14151a"/>
  </g>
  <g clip-path="url(#ph)">
    <rect x="812" y="330" width="210" height="430" fill="#14151a"/>
    <rect x="890" y="342" width="54" height="14" rx="7" fill="#0a0a0c"/>
    <rect x="832" y="384" width="26" height="26" rx="8" fill="url(#gold)"/>
    <rect x="974" y="392" width="30" height="4" rx="2" fill="#8a8c94"/><rect x="974" y="402" width="30" height="4" rx="2" fill="#8a8c94"/>
    <rect x="832" y="446" width="90" height="8" rx="4" fill="#c9a76e"/>
    <rect x="832" y="468" width="160" height="20" rx="6" fill="#f1efe9"/><rect x="832" y="496" width="124" height="20" rx="6" fill="#f1efe9"/>
    <rect x="832" y="534" width="140" height="36" rx="9" fill="url(#gold)"/>
    <rect x="832" y="592" width="170" height="86" rx="12" fill="#23252d"/>
    <path d="M832 660c36-30 62-30 90-8s56 10 80-12v22a12 12 0 0 1-12 12H844a12 12 0 0 1-12-12z" fill="#c9a76e" fill-opacity=".3"/>
    <rect x="832" y="694" width="80" height="8" rx="4" fill="#4a4c54"/><rect x="832" y="712" width="120" height="8" rx="4" fill="#4a4c54"/>
  </g>

  <!-- Farbpalette -->
  <g transform="translate(150 780)">
    <circle cx="14" cy="14" r="14" fill="#0b0c0f" stroke="#fff" stroke-opacity=".25"/>
    <circle cx="52" cy="14" r="14" fill="#f1efe9"/>
    <circle cx="90" cy="14" r="14" fill="#e6c88f"/>
    <circle cx="128" cy="14" r="14" fill="#b08a4e"/>
  </g>
</svg>
